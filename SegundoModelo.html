<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E11D48">
<title>SME-RT · Encuesta y administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
/* Identidad visual tomada de Ejemplo.html: coral como color principal, verde azulado como acento,
   ámbar para avisos, fondo crema y tinta color piedra; Manrope, JetBrains Mono y Material Symbols. */
:root{
  --primary:#E11D48;--primary-600:#BE123C;--primary-50:#FFE1E8;--navy:#1F1A1C;--accent:#0D9488;--accent-50:#C9F7EE;
  --ok:#15A34A;--ok-50:#D6F8E1;--warn:#B45309;--warn-50:#FFEDC2;--bad:#DC2626;--bad-50:#FFE0E0;
  --bg:#FFF7F5;--card:#FFFFFF;--surface-2:#FFF0F2;--text:#1F1A1C;--ink-2:#4A4245;--muted:#6E6468;--line:#F8DFE3;
  --seq1:#FFE1E8;--seq2:#FFA3B7;--seq3:#FF6585;--seq4:#F2335A;--seq5:#BE123C;
  --grad:linear-gradient(135deg,#FFE1E8 0%,#FFF4E5 50%,#D9FBF4 100%);
  --g-primary:linear-gradient(135deg,#FF6B81 0%,#FF3D63 45%,#E11D48 100%);
  --g-accent:linear-gradient(135deg,#2DD4BF,#0D9488);
  --shadow:0 1px 2px rgba(31,26,28,.05),0 8px 24px rgba(225,29,72,.07);
  --shadow-lg:0 2px 4px rgba(31,26,28,.05),0 18px 40px rgba(225,29,72,.18);
  --glow:radial-gradient(900px 480px at 0% -10%,rgba(255,61,99,.10),transparent 70%),radial-gradient(800px 460px at 100% 0%,rgba(0,179,161,.10),transparent 70%);
  --r:20px;--r-sm:12px;--font:"Manrope","Segoe UI",system-ui,sans-serif;--head:"Manrope","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171214;--card:#221A1D;--surface-2:#2B2125;--text:#F6EDEF;--ink-2:#D8CCD0;--muted:#A8999E;--line:#3A2C31;
  --primary:#FF4D6D;--primary-600:#FF6B81;--primary-50:#3F1A24;--accent:#2DD4BF;--accent-50:#123A36;
  --ok-50:#123221;--warn-50:#3A2A10;--bad-50:#3D1A1A;--seq1:#3F1A24;
  --grad:linear-gradient(135deg,#3A1823 0%,#2E2219 50%,#11302C 100%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 18px 40px rgba(0,0,0,.45);
  --glow:radial-gradient(900px 480px at 0% -10%,rgba(255,61,99,.14),transparent 70%),radial-gradient(800px 460px at 100% 0%,rgba(0,179,161,.12),transparent 70%)}}
:root[data-theme="dark"]{
  --bg:#171214;--card:#221A1D;--surface-2:#2B2125;--text:#F6EDEF;--ink-2:#D8CCD0;--muted:#A8999E;--line:#3A2C31;
  --primary:#FF4D6D;--primary-600:#FF6B81;--primary-50:#3F1A24;--accent:#2DD4BF;--accent-50:#123A36;
  --ok-50:#123221;--warn-50:#3A2A10;--bad-50:#3D1A1A;--seq1:#3F1A24;
  --grad:linear-gradient(135deg,#3A1823 0%,#2E2219 50%,#11302C 100%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 18px 40px rgba(0,0,0,.45);
  --glow:radial-gradient(900px 480px at 0% -10%,rgba(255,61,99,.14),transparent 70%),radial-gradient(800px 460px at 100% 0%,rgba(0,179,161,.12),transparent 70%)}
*{box-sizing:border-box}
html{scroll-padding-bottom:110px;scroll-padding-top:calc(var(--topbar-h,66px) + 24px)}
@media (max-width:920px){html{scroll-padding-top:calc(var(--topbar-h,66px) + 76px)}}
html,body{margin:0;color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html{background:var(--bg)}
body{background:var(--glow),var(--bg);background-attachment:fixed;min-height:100vh}
h1,h2,h3{font-family:var(--head);font-weight:800;line-height:1.15;text-wrap:balance;margin:0 0 .5rem}
h1{font-size:clamp(1.6rem,4.4vw,2.4rem);letter-spacing:-.025em}h2{font-size:clamp(1.25rem,3vw,1.6rem);letter-spacing:-.01em}h3{font-size:1.08rem}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.app{max-width:1080px;margin:0 auto;padding:6px 16px 120px}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#FF3D63,#FF8A3D 50%,#00B3A1)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:1.1rem;letter-spacing:-.01em;color:var(--text);line-height:1.1}
.brand-mark{width:42px;height:42px;border-radius:13px;background:var(--g-primary);box-shadow:0 6px 18px rgba(225,29,72,.38);display:grid;place-items:center;flex:none}
.brand-mark .ms{color:#fff;font-size:26px}
.brand small{display:block;font-family:var(--font);font-weight:500;color:var(--muted);font-size:.78rem;letter-spacing:0}
.spacer{flex:1}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--accent-50);color:var(--accent)}
.chip.off{background:var(--bad-50);color:var(--bad)}.chip.ok{background:var(--ok-50);color:var(--ok)}.chip.warn{background:var(--warn-50);color:var(--warn)}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--text);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;transition:border-color .2s,color .2s}
.iconbtn:hover{border-color:var(--seq2);color:var(--primary)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:clamp(16px,2.6vw,24px);margin:16px 0}
.btn{text-decoration:none;appearance:none;border:0;border-radius:14px;padding:11px 20px;font:700 1rem var(--font);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:transform .15s ease,box-shadow .2s,background .2s,border-color .2s,color .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--g-primary);color:#fff;box-shadow:0 8px 22px rgba(225,29,72,.34)}
.btn.primary:hover{box-shadow:0 12px 28px rgba(225,29,72,.44)}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--primary-50);border-color:var(--seq2);color:var(--primary)}
.btn.soft{background:var(--primary-50);color:var(--primary)}
.btn.danger{background:linear-gradient(135deg,#F87171,#DC2626);color:#fff;box-shadow:0 8px 20px rgba(220,38,38,.28)}
.btn.accent{background:var(--g-accent);color:#fff;box-shadow:0 8px 22px rgba(13,148,136,.32)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.block{width:100%}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
#net{flex:0 0 auto}
@media (max-width:480px){.brand small{display:none}.brand-mark{width:38px;height:38px;border-radius:12px}}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}.card{padding:16px}}
label.f{display:block;font-weight:700;font-size:.93rem;margin:10px 0 6px}
.hint{color:var(--muted);font-size:.86rem}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:500 1rem var(--font);min-height:48px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--seq4);box-shadow:0 0 0 4px var(--primary-50)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0}
.opt span{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-weight:500;cursor:pointer;transition:all .18s;user-select:none}
.opt span:hover{border-color:var(--seq2)}
.opt input:checked+span{border-color:var(--primary);background:var(--primary);color:#fff;font-weight:700;box-shadow:0 6px 14px rgba(225,29,72,.22);transform:translateY(-1px)}
.opt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.q{padding:12px 14px;margin:10px 0;border:1.5px solid var(--line);border-left:4px solid var(--seq1);border-radius:16px;background:var(--card)}
.q .t{font-weight:700;margin-bottom:8px}
.stepper{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s}
.st b{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2);font:600 .74rem var(--mono)}
.st.cur{border-color:transparent;background:var(--accent-50);color:var(--text)}.st.cur b{background:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(13,148,136,.18)}
.st.done b{background:var(--primary);color:#fff;box-shadow:none}
.moment{font-size:.84rem;letter-spacing:.01em;color:var(--primary);font-weight:800}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FF3D63,#FF8A3D 50%,#00B3A1);border-radius:inherit;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.navbar .in{max-width:1080px;margin:0 auto;display:flex;gap:10px}
.navbar .btn{flex:1}
.view{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.bar i{transition:none}}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.lot{width:100%;max-width:280px;aspect-ratio:1;margin:auto}
.lot.sm{max-width:120px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:700}
.b-ok{background:var(--ok-50);color:var(--ok)}.b-warn{background:var(--warn-50);color:var(--warn)}.b-bad{background:var(--bad-50);color:var(--bad)}.b-info{background:var(--primary-50);color:var(--primary)}
.list .it{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--card);cursor:pointer;transition:.2s}
.list .it:hover{border-color:var(--seq2);background:var(--primary-50);transform:translateY(-1px)}
.avatar{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--g-primary);box-shadow:0 6px 16px rgba(225,29,72,.22);flex:0 0 auto}
.slide{min-height:260px}
.tl{display:grid;gap:10px}
.tl .s{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface-2)}
.tl .s:nth-child(even){background:color-mix(in srgb,var(--accent-50) 60%,var(--card))}
.tl .n{width:32px;height:32px;border-radius:10px;background:var(--g-primary);color:#fff;display:grid;place-items:center;font:600 .85rem var(--mono);flex:0 0 auto}
details.acc{border:1px solid var(--line);border-left:4px solid var(--seq3);border-radius:16px;margin:8px 0;background:var(--card)}
details.acc summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none}
details.acc summary::after{content:"＋";float:right;color:var(--primary)}
details.acc[open] summary::after{content:"－"}
details.acc div{padding:0 14px 12px;color:var(--ink-2)}
.sig{width:100%;height:170px;border:1.5px dashed var(--seq2);border-radius:14px;background:var(--card);touch-action:none;display:block}
.score{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.score .num{font:800 2.4rem var(--head);min-width:64px;text-align:center;line-height:1}
.lvl0{color:var(--ok)}.lvl1{color:#5a9e2e}.lvl2{color:#C2410C}.lvl3{color:#EA580C}.lvl4{color:var(--bad)}
.seg{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
@media (max-width:640px){.seg{grid-template-columns:1fr}}
.fan{width:150px;height:150px;color:var(--text)}
.ptai-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.light{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid #0002;vertical-align:middle}
.l-g{background:#16A34A}.l-y{background:#F59E0B}.l-r{background:#DC2626}.l-n{background:var(--line)}
.slider{width:100%;accent-color:var(--primary);height:36px}
.scale{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.ticks{display:grid;grid-template-columns:repeat(21,1fr);height:10px;margin-top:-6px}
.ticks i{border-left:1px solid var(--line)}.ticks i:nth-child(2n+1){border-left:2px solid var(--muted)}
.likert{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.likert.l5{grid-template-columns:repeat(5,minmax(0,1fr))}
.likert .opt span{width:100%;justify-content:center;text-align:center;font-size:.78rem;padding:8px 4px;line-height:1.15;min-height:52px}
@media (max-width:640px){.likert{grid-template-columns:repeat(4,minmax(0,1fr))}.likert.l5{grid-template-columns:repeat(3,minmax(0,1fr))}}
.body-wrap{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
@media (max-width:720px){.body-wrap{grid-template-columns:1fr}}
svg.body .reg{fill:var(--surface-2);stroke:var(--muted);stroke-width:1.2;cursor:pointer;transition:fill .25s,stroke .25s}
svg.body .reg:hover{fill:var(--primary-50)}
svg.body .reg.on{fill:var(--accent);stroke:var(--accent)}
svg.body .sil{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.ring{width:150px;height:150px;margin:auto;display:block}
.toast{pointer-events:none;position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--card);padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:var(--shadow-lg);opacity:0;transition:.3s;z-index:60;max-width:90vw}
.toast{border-radius:14px;max-width:min(92vw,460px);width:max-content;text-align:center;line-height:1.35;padding:12px 18px}
.toast.show{opacity:1;transform:translateX(-50%)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}
.note{padding:12px 14px;border-radius:14px;background:var(--warn-50);color:var(--text);border-left:4px solid #F59E0B;font-size:.92rem}
.note.info{background:var(--accent-50);border-left-color:var(--accent)}
.cssCheck{width:110px;height:110px;margin:auto;border-radius:50%;background:var(--g-accent);display:grid;place-items:center;color:#fff;font-size:56px;box-shadow:0 10px 28px rgba(13,148,136,.32);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.req::after{content:" *";color:var(--bad)}
.kbd{font:600 .8rem var(--mono);padding:2px 6px;border:1px solid var(--line);border-radius:6px}

.role{display:block;text-align:left;cursor:pointer;font:inherit;color:inherit;border-radius:22px;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s}
.role:hover{transform:translateY(-4px);border-color:var(--seq2);box-shadow:var(--shadow-lg)}
.role-ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--g-primary);color:#fff;box-shadow:0 8px 20px rgba(225,29,72,.3);margin-bottom:12px}
.role-ic .ms{font-size:32px}
#goAdmin .role-ic{background:var(--g-accent);box-shadow:0 8px 20px rgba(13,148,136,.3)}
#goAdmin .btn.ghost{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:14px 0 4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;scrollbar-width:none;width:max-content;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;color:var(--ink-2);padding:8px 15px;border-radius:999px;font:700 .9rem var(--font);cursor:pointer;min-height:40px;transition:background .2s,color .2s,box-shadow .2s}
.tab:hover{color:var(--primary)}
.tab.on{background:var(--card);color:var(--primary);box-shadow:0 4px 14px rgba(225,29,72,.14)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0}
.kpi{background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.kn{font:800 2rem var(--head);line-height:1.1}.kl{font-weight:700;font-size:.9rem;color:var(--ink-2)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.gimg{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card);cursor:zoom-in;transition:transform .2s,box-shadow .2s}
.gimg:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.gimg img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gimg figcaption{padding:6px 8px;font-size:.76rem;color:var(--ink-2)}.gimg figcaption span{color:var(--muted)}
.drop{display:grid;place-items:center;gap:6px;padding:30px;border:2px dashed var(--seq2);border-radius:18px;background:var(--grad);cursor:pointer;text-align:center;transition:.2s}
.drop.over{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-50)}
#modal{position:fixed;inset:0;z-index:80;background:rgba(28,25,23,.45);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.sheet{position:relative;background:var(--card);border-radius:22px;padding:22px;max-width:900px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(31,26,28,.3)}
.closeM{position:absolute;top:12px;right:12px}
.lb img{width:100%;max-height:70vh;object-fit:contain;border-radius:12px;background:#000}
.lb-meta{margin:10px 0}
.rowlink{cursor:pointer}.rowlink td{transition:background .15s}.rowlink:hover td{background:var(--primary-50)}

/* ---------- encuesta: formato de Ejemplo (riel de pasos + tarjeta del paso) ---------- */
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.8rem;letter-spacing:.01em;color:var(--muted);font-weight:700;margin:0}
.chip.code{background:var(--primary-50);color:var(--primary);font-size:.86rem;letter-spacing:.03em}
.chip.a{background:var(--accent-50);color:var(--accent)}
.btn .ms{font-size:20px}
.survey{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start;margin-top:22px}
.rail{position:sticky;top:calc(var(--topbar-h,66px) + 20px);margin:0;padding:14px;max-height:calc(100vh - var(--topbar-h,66px) - 40px);overflow-y:auto;scrollbar-width:thin}
.rail-m{margin:12px 8px 4px;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--primary)}
.rail-m:first-of-type{margin-top:0}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail li button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 10px;border-radius:12px;cursor:pointer;font-size:.92rem;color:var(--ink-2)}
.rail li button:hover{background:var(--surface-2)}
.rail li button:disabled{cursor:default;opacity:.7}.rail li button:disabled:hover{background:none}
.rail li button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.rail li button[aria-current="step"]{background:var(--accent-50);color:var(--text);font-weight:700}
.rail .dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--mono);font-size:.75rem;border:1.5px solid var(--line);background:var(--card);transition:all .25s}
.rail .dot .ms{font-size:16px}
.rail li.done .dot{background:var(--primary);border-color:var(--primary);color:#fff}
.rail li button[aria-current="step"] .dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(13,148,136,.18)}
.rail .who{font-size:.74rem;color:var(--muted);display:block;line-height:1.2;font-weight:500}
.rail-foot{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:.84rem;color:var(--muted)}
.rail-foot b{color:var(--text)}
.mobile-progress{display:none}
.stepper2{list-style:none;margin:0;padding:4px 2px;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none}
.stepper2::-webkit-scrollbar{display:none}
.stepper2 li{display:flex}
.stepper2 .ln{flex:1 0 8px;height:3px;background:var(--line);margin:0 2px;border-radius:2px}
.stepper2 .ln.on{background:var(--seq3)}
.stepper2 .sd{width:30px;height:30px;border-radius:9px;border:0;display:grid;place-items:center;font:800 .84rem var(--font);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2);cursor:pointer;padding:0;transition:transform .2s,box-shadow .2s}
.stepper2 .sd:disabled{cursor:default}

.mp-cap{font-size:.9rem;color:var(--muted);margin:8px 0 0}

.step{--pad:clamp(14px,2.6vw,26px);padding:var(--pad);margin:0;animation:enter .45s cubic-bezier(.2,.8,.2,1)}
.step-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;margin-bottom:6px}

/* las secciones del paso se integran en la tarjeta (sin tarjetas anidadas con sombra) */

.nasa-range::-moz-range-track{height:12px;border-radius:6px;background:linear-gradient(90deg,#2DD4BF,#FBBF24 50%,#E11D48)}

<script>
/* =================== Utilidades =================== */
const $ = (s, el = document) => el.querySelector(s);

/* Tema */
(() => { const t = LS.get("theme", null); if (t) document.documentElement.dataset.theme = t; })();
$("#themeBtn").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx; LS.set("theme", nx); };

addEventListener("online", netUpd); addEventListener("offline", netUpd); netUpd();

/* =================== Animaciones Lottie (definidas en línea, sin descargas) =================== */
const C = hex => { const h = hex.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255).concat(1); };
const kf = (t, s, last) => last ? { t, s } : { t, s, o: { x: [0.3], y: [0] }, i: { x: [0.2], y: [1] } };
function strokeLayer(ind, shape, color, w, startT, endT, extra = {}) {
  return { ddd: 0, ind, ty: 4, nm: "l" + ind, sr: 1, ao: 0, ip: 0, op: 600, st: 0, bm: 0,
    ks: { o: { a: 0, k: 100 }, r: { a: 0, k: 0 }, p: { a: 0, k: [60, 60, 0] }, a: { a: 0, k: [0, 0, 0] }, s: extra.scale || { a: 0, k: [100, 100, 100] } },
    shapes: [{ ty: "gr", nm: "g", it: [shape,
      { ty: "st", nm: "s", c: { a: 0, k: C(color) }, o: { a: 0, k: 100 }, w: { a: 0, k: w }, lc: 2, lj: 2 },
      { ty: "tm", nm: "t", s: { a: 0, k: 0 }, e: { a: 1, k: [kf(startT, [0]), kf(endT, [100], 1)] }, o: { a: 0, k: 0 }, m: 1 },
      { ty: "tr", p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: [100, 100] }, r: { a: 0, k: extra.rot ?? -90 }, o: { a: 0, k: 100 } }] }] };
}
const ellipse = d => ({ ty: "el", nm: "e", p: { a: 0, k: [0, 0] }, s: { a: 0, k: [d, d] } });
const path = (pts) => ({ ty: "sh", nm: "p", ks: { a: 0, k: { i: pts.map(() => [0, 0]), o: pts.map(() => [0, 0]), v: pts, c: false } } });
const ANIM = {
  check: c => ({ v: "5.7.4", fr: 60, ip: 0, op: 70, w: 120, h: 120, nm: "check", ddd: 0, assets: [],
    layers: [strokeLayer(1, path([[-22, 2], [-7, 17], [24, -15]]), "#FFFFFF", 7, 22, 48, { rot: 0 }),
             { ...strokeLayer(2, ellipse(92), c, 46, 0, 26), shapes: [{ ty: "gr", nm: "g", it: [ellipse(92),
               { ty: "fl", nm: "f", c: { a: 0, k: C(c) }, o: { a: 1, k: [kf(0, [0]), kf(20, [100], 1)] } },
               { ty: "tr", p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 1, k: [kf(0, [40, 40]), kf(24, [100, 100], 1)] }, r: { a: 0, k: 0 }, o: { a: 0, k: 100 } }] }] }] }),
  pulse: c => ({ v: "5.7.4", fr: 60, ip: 0, op: 120, w: 120, h: 120, nm: "pulse", ddd: 0, assets: [],
    layers: [0, 30, 60].map((d, i) => ({ ddd: 0, ind: i + 1, ty: 4, nm: "r" + i, sr: 1, ao: 0, ip: 0, op: 120, st: 0, bm: 0,
      ks: { o: { a: 1, k: [kf(d, [90]), kf(Math.min(d + 80, 119), [0], 1)] }, r: { a: 0, k: 0 }, p: { a: 0, k: [60, 60, 0] }, a: { a: 0, k: [0, 0, 0] },
            s: { a: 1, k: [kf(d, [20, 20, 100]), kf(Math.min(d + 80, 119), [100, 100, 100], 1)] } },
      shapes: [{ ty: "gr", nm: "g", it: [ellipse(100), { ty: "st", nm: "s", c: { a: 0, k: C(c) }, o: { a: 0, k: 100 }, w: { a: 0, k: 4 }, lc: 2, lj: 2 },
        { ty: "tr", p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: [100, 100] }, r: { a: 0, k: 0 }, o: { a: 0, k: 100 } }] }] }))
      .concat([{ ddd: 0, ind: 9, ty: 4, nm: "core", sr: 1, ao: 0, ip: 0, op: 120, st: 0, bm: 0,
        ks: { o: { a: 0, k: 100 }, r: { a: 0, k: 0 }, p: { a: 0, k: [60, 60, 0] }, a: { a: 0, k: [0, 0, 0] }, s: { a: 1, k: [kf(0, [90, 90, 100]), kf(60, [105, 105, 100]), kf(119, [90, 90, 100], 1)] } },
        shapes: [{ ty: "gr", nm: "g", it: [ellipse(34), { ty: "fl", nm: "f", c: { a: 0, k: C(c) }, o: { a: 0, k: 100 } },
          { ty: "tr", p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: [100, 100] }, r: { a: 0, k: 0 }, o: { a: 0, k: 100 } }] }] }]) }),
  send: c => ({ v: "5.7.4", fr: 60, ip: 0, op: 80, w: 120, h: 120, nm: "send", ddd: 0, assets: [],

};
function playLottie(el, name, color = "#E11D48", loop = false) {
  if (!el) return;
  if (window.lottie) { try { lottie.loadAnimation({ container: el, renderer: "svg", loop, autoplay: true, animationData: ANIM[name](color) }); return; } catch (e) {} }
  el.innerHTML = name === "check" ? '<div class="cssCheck">✓</div>' : '<div class="cssCheck" style="background:' + color + '">•</div>';

/* =================== Almacenamiento (IndexedDB) =================== */
const DB = { db: null,
  open() { return new Promise((res, rej) => { const r = indexedDB.open("smert_encuesta", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("records", { keyPath: "code" });
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  all() { return new Promise(res => { const out = []; const c = this.db.transaction("records").objectStore("records").openCursor();
    c.onsuccess = e => { const cur = e.target.result; if (cur) { out.push(cur.value); cur.continue(); } else res(out); }; }); },
  put(rec) { if (rec.consent) ["nombre", "dni", "sigP", "sigI"].forEach(k => delete rec.consent[k]); rec.updatedAt = now(); return new Promise(res => { const tx = this.db.transaction("records", "readwrite"); tx.objectStore("records").put(rec); tx.oncomplete = res; }); },
  putRaw(rec) { return new Promise(res => { const tx = this.db.transaction("records", "readwrite"); tx.objectStore("records").put(rec); tx.oncomplete = res; }); },
  del(code) { return new Promise(res => { const tx = this.db.transaction("records", "readwrite"); tx.objectStore("records").delete(code); tx.oncomplete = res; }); }

/* =================== Contenido de los instrumentos =================== */
const TITULO = "Factores ocupacionales asociados a síntomas musculoesqueléticos relacionados con el trabajo en fisioterapeutas egresados e internos en actividad asistencial de la Universidad Católica Sedes Sapientiae, 2026";

  { h: "Bienvenida", b: `<p class="hint">Escuela de Posgrado · Universidad Nacional de Piura</p><p><b>${TITULO}</b></p><p>Investigador: Lic. TM. Marlon Stevinson Rosas Chero · Asesora: Dra. Rosario Nelly Elera Ojeda</p>` },
  { h: "¿Por qué este estudio?", b: `<p>Los fisioterapeutas movilizan pacientes, mantienen posturas y repiten movimientos durante su jornada. Queremos conocer qué factores de la <b>organización del trabajo</b>, de las <b>posturas y la manipulación de pacientes</b> y del <b>ambiente psicosocial</b> se asocian con las molestias musculoesqueléticas en internos y egresados recientes.</p>` },
  { h: "¿Qué haremos?", b: `<div class="tl">

  { h: "Voluntario y confidencial", b: `<p>Su participación es <b>voluntaria</b>; puede no responder o retirarse sin consecuencias académicas ni laborales. Usted se identifica solo con un <b>código</b> (no registramos su nombre ni DNI en la aplicación), no se revisan historias clínicas y los resultados se publican solo de forma agregada. <b>No se graban videos</b>; las fotos de posturas son opcionales.</p>` }
];
const CONSENT = [
  ["1. Propósito", "Conocer qué factores de su trabajo asistencial se asocian con la presencia de molestias musculoesqueléticas en fisioterapeutas egresados e internos."],
  ["2. ¿Quiénes pueden participar?", "Internos 2026 y egresados 2020-2025 de la filial Morropón–Chulucanas que atienden pacientes en Chulucanas o Piura, con al menos tres meses de actividad asistencial."],
  ["3. Procedimientos", "Momento 1: ficha de datos (≈5 min), observación de 2-3 tareas (30-45 min), entrevista breve y cuestionario de carga (≈10 min). Momento 2: cuestionarios (20-30 min, con una pausa). Solo fotografías de posturas si usted lo autoriza; no se graban videos."],
  ["4. Riesgos", "Riesgo mínimo: incomodidad o cansancio al responder, o preocupación por sus síntomas."],
  ["5. Beneficios", "No hay beneficio clínico directo ni pago. Recibirá un resumen de resultados generales y recomendaciones ergonómicas; si reporta molestias que le impiden sus actividades, recibirá orientación para acudir a un servicio de salud."],
  ["6. Voluntariedad", "Puede no responder o retirarse en cualquier momento sin consecuencias académicas ni laborales. Quienes le invitan no tienen relación de evaluación ni supervisión con usted."],
  ["7. Confidencialidad", "Se usará un código; sus datos personales se guardan separados y cifrados, solo accesibles al investigador, y se destruyen cinco años después. Resultados solo agregados."],
  ["8. Contactos", "Investigador y Comité de Ética de la Investigación de la Facultad de Ciencias de la Salud, Universidad Nacional de Piura (ver hoja impresa)."]
];
const TASKS = ["Movilización pasiva", "Estiramientos pasivos", "Transferencias y cambios de posición del paciente", "Terapia manual y masoterapia",
  "Entrenamiento de la marcha y facilitación del movimiento", "Manejo de equipos de agentes físicos", "Otra"];
const PTAI_OBS = [
  ["1. Condiciones de trabajo", ["Temperatura", "Corriente de aire", "Luz"]],
  ["2. Entorno laboral y calzado", ["Espacio", "Sujetador ajustable", "Zapatos"]],
  ["3. Elevadores de pacientes", ["Presente", "Adecuado", "Uso correcto"]],
  ["4. Pequeñas ayudas", ["Presente", "Adecuado", "Uso correcto"]],
  ["5. Distancia y altura de transferencia", ["No pisar", "Rodilla-codo", "No alcanzar"]],
  ["6. Carga de extremidades superiores y tronco", ["Sujetar", "Codo/hombro", "Muñeca/dedos"]],

];

/* Esquema de ángulos (abanico) para REBA */
function fan(ranges, title) {
  const cx = 80, cy = 80, R = 66; const cols = ["#16A34A", "#84CC16", "#F59E0B", "#EA580C", "#DC2626"];
  const toXY = a => { const rad = (a - 90) * Math.PI / 180; return [cx + R * Math.cos(rad), cy + R * Math.sin(rad)]; };
  let s = `<svg class="fan" viewBox="0 0 160 160" role="img" aria-label="${esc(title)}">`;
  ranges.forEach((r, i) => { const [a0, a1, lab, ci] = r; const [x0, y0] = toXY(a0), [x1, y1] = toXY(a1); const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
    s += `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${cols[ci]}" opacity=".55" stroke="#fff" stroke-width="1"/>`;
    const [lx, ly] = toXY((a0 + a1) / 2).map((v, k) => k ? cy + (v - cy) * .72 : cx + (v - cx) * .72); s += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="700">${lab}</text>`; });
  s += `<circle cx="${cx}" cy="${cy}" r="4" fill="currentColor"/><line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - R}" stroke="currentColor" stroke-dasharray="3 3"/></svg>`;
  return s;
}

function bindHome() {
  if ($("#newRec")) $("#newRec").onclick = () => { S.rec = null; saveSession(); location.hash = "#encuesta"; };
  $("#sendBtn").onclick = () => { S.view = "send"; render(); };
  $("#cfgBtn").onclick = () => { S.view = "config"; render(); };
  $$("[data-open]").forEach(el => el.onclick = async () => { const r = (await DB.all()).find(x => x.code === el.dataset.open); if (!r) return; S.rec = r; S.slide = 0;
    S.step = r.status === "m1" ? STEPS.findIndex(s => s.m === 2) : (r.lastStep ?? 0); location.hash = "#encuesta"; });
}

  const it = S.settings.copsoqItems;

function bindConfig() {
  $("#homeBtn").onclick = () => { S.view = "home"; render(); };
  $("#copsoqFile").onchange = async e => { try { const j = JSON.parse(await e.target.files[0].text()); const ok = COPSOQ_DIMS.every(([k, , n]) => Array.isArray(j[k]) && j[k].length === n);
    if (!ok) return toast("El archivo no tiene 7/3/5/7/5/4 ítems por dimensión"); S.settings.copsoqItems = j; LS.set("settings", S.settings); toast("Ítems cargados"); render(); } catch { toast("Archivo JSON no válido"); } };
  $("#gsTest").onclick = async () => { const m = $("#gsTestMsg"), prev = S.settings.gsUrl; S.settings.gsUrl = $("#gsUrl").value.trim(); m.textContent = "Probando…";
    try { const j = await gsCall({ action: "estado" }); m.textContent = j.configurado ? "Conectado: la base de datos responde." : "El servidor responde, pero falta ejecutar configurar() en Apps Script."; }
    catch (e) { m.textContent = "No se pudo conectar: " + e.message; } finally { S.settings.gsUrl = prev; } };
  $("#saveCfg").onclick = () => { S.settings.encuestador = $("#encName").value.trim(); S.settings.gsUrl = $("#gsUrl").value.trim(); LS.set("settings", S.settings); toast("Configuración guardada"); S.view = "home"; render(); };
}

/* =================== Cálculos y validación =================== */
function smeRT(r) {
  const n = r.m2.nordico || {}; if (!REGIONS.every(([id]) => n[id]?.m12)) return null;
  return REGIONS.some(([id]) => n[id].m12 === "si" && (r.m2.modulo?.[id]?.atrib === "si" || r.m2.modulo?.[id]?.temp === "si"));
}
function nasaScore(r) { const v = NASA.map(([k]) => r.m1.nasa[k]); if (v.some(x => x == null)) return null; return Math.round(v.reduce((a, b) => a + +b, 0) / 6 * 5 * 10) / 10; }
function warrScore(r) { const w = r.m2.warr || {}; const vals = Array.from({ length: 15 }, (_, i) => w["i" + (i + 1)]); if (vals.some(v => v == null)) return null;
  const sc = idx => { const ans = idx.map(i => vals[i - 1]).filter(v => v !== "NA").map(Number); if (ans.length / idx.length < .8) return null; return Math.round(ans.reduce((a, b) => a + b, 0) / ans.length * idx.length * 10) / 10; };
  return { total: sc([...Array(15)].map((_, i) => i + 1)), intr: sc([2, 4, 6, 8, 10, 12, 14]), extr: sc([1, 3, 5, 7, 9, 11, 13, 15]) }; }
function completeness(r) {
  const tasksOk = r.m1.tasks.filter(t => t && rebaCalc(t.reba)).length >= 2;
  const ocraOk = !!(ocraCalc(r.m1.ocra.der) || ocraCalc(r.m1.ocra.izq));
  const ptaiOk = r.m1.ptai.aplica === "no" || (r.m1.ptai.aplica === "si" && r.m1.ptai.int.abc0 && r.m1.ptai.int.abc1);
  const f = r.m2.ficha || {}; const fichaReq = ["edad", "sexo", "peso", "talla", "mano", "sede", "area", "horasDia", "diasSemana", "pacientesDia", "pausasN", "pausaMin", "pausaTipo", "pausaProg", "pausaCumpl", "segunda", "horasAcad", "dependencia", "terapiaManual", "ayudas", "capacitacion", "transfiere", "actFisica", "trauma"];
  const fichaFalt = fichaReq.filter(k => f[k] == null || f[k] === "").length;
  const copsoqN = Object.keys(r.m2.copsoq || {}).length;
  return [["Consentimiento", r.consent.participa === "si", "pendiente"], ["REBA (≥ 2 tareas)", tasksOk, "faltan tareas"], ["Check List OCRA", ocraOk, "pendiente"],
    ["PTAI", !!ptaiOk, "pendiente"], ["NASA-TLX", nasaScore(r) !== null, "incompleto"], ["Ficha", fichaFalt === 0, `faltan ${fichaFalt} datos`],
    ["CENSOPAS-COPSOQ", copsoqN >= 31, S.settings.copsoqItems ? `${copsoqN}/31` : "pendiente (ítems oficiales)"], ["Satisfacción laboral", !!warrScore(r)?.total, "incompleto"],
    ["Cuestionario Nórdico", smeRT(r) !== null, "incompleto"]];
}
function validate(id) {
  const r = S.rec;
  if (id === "pres") { if (!r.estrato || !r.code) return "Indique la condición del participante para asignar su código";
    if (r.code[0] !== r.estrato[0]) return "El código no coincide con la condición (E = egresado, I = interno): genere otro"; }
  if (id === "eleg") { const e = r.eleg; if (ELEG_CRIT.some(([k]) => !e[k])) return "Responda todos los criterios de participación";
    if (elegFails().length) return "NO_ELEGIBLE"; }
  if (id === "cons") { const c = r.consent; if (!c.participa) return "Registre si acepta participar"; if (c.participa === "no") return "RECHAZO";
    if (!c.fotos) return "Registre si autoriza fotografías"; if (!c.papel) return "Confirme la firma de la hoja impresa"; }
  if (id === "obs") { const f = rebaPend(); if (f) return f.msg; }
  if (id === "ptai" && !r.m1.ptai.aplica) return "Indique si realiza transferencias";
  if (id === "nasa" && nasaScore(r) === null) { const m = NASA.find(([k]) => r.m1.nasa[k] == null); return `Falta responder «${m[1]}»: toque un nivel o la escala (aunque su respuesta sea 10)`; }
  return null;
}

/* =================== Enlaces de eventos =================== */
let saveT;
const autosave = () => { saveSession(); clearTimeout(saveT); saveT = setTimeout(async () => { if (S.rec?.code) { S.rec.lastStep = S.step; await DB.put(S.rec); flashSaved(); } }, 400); };
/* Al actualizar la página se vuelve al mismo participante, paso y posición. Con código, el registro completo está en el
   dispositivo (IndexedDB); sin código todavía (antes de elegir la condición), el borrador va en la sesión. */
const SES_KEY = "sesion";
function saveSession() {
  if (!S.rec) { LS.set(SES_KEY, null); return; }
  // copia sin fotos (las fotos se guardan al instante en el dispositivo y pesan demasiado para la sesión)
  const draft = JSON.parse(JSON.stringify(S.rec, (k, v) => k === "photos" || k === "fotosPaso" ? undefined : v));
  LS.set(SES_KEY, { code: S.rec.code || "", createdAt: S.rec.createdAt, step: S.step, y: Math.round(scrollY), at: Date.now(), draft });
}
async function restoreSession() {
  const ss = LS.get(SES_KEY, null); if (!ss) return;
  const db = ss.code ? (await DB.all()).find(r => r.code === ss.code && r.createdAt === ss.createdAt) : null;
  let rec = db || ss.draft;
  // si la copia de la sesión es más reciente que lo guardado (se recargó antes de terminar de guardar), se usa con sus fotos
  if (db && ss.draft && ss.at > Date.parse(db.updatedAt || 0)) { rec = ss.draft; (rec.m1?.tasks || []).forEach((t, i) => { if (t) t.photos = db.m1?.tasks?.[i]?.photos || []; }); rec.fotosPaso = db.fotosPaso || []; }
  if (!rec || ["completo", "rechazo", "no_elegible"].includes(rec.status)) return LS.set(SES_KEY, null);
  S.rec = rec; S.step = Math.min(Math.max(0, ss.step | 0), STEPS.length - 1); S._restoreY = ss.y || 0;
}
// guarda lo pendiente al recargar, cerrar o cambiar de aplicación (sin esperar la pausa del autoguardado)

async function hashPw(pw) {
  const data = "SME-RT-2026::" + pw;
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(data)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch { let h = 5381; for (const c of data) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return "x" + (h >>> 0).toString(16); }
}

// criterios no cumplidos de cualquier registro (elegFails usa el registro abierto)
const elegFailsDe = r => ELEG_CRIT.filter(([k, , , , ok]) => r.eleg?.[k] && r.eleg[k] !== ok);
// pendiente de envío: nunca enviado o con cambios posteriores al último envío
const gsPend = r => r.code && (!r.gs?.at || (r.updatedAt || "") > r.gs.at);
async function gsCall(req) {
  const url = gsUrl(); if (!url) throw Object.assign(new Error("Falta el enlace del servidor de Google (Configuración)"), { code: "config" });
  const res = await fetch(url, { method: "POST", body: JSON.stringify(req) });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json(); if (!j.ok) throw Object.assign(new Error(j.error || "Error del servidor"), { code: j.code }); return j;
}
// envía un registro: primero sus fotos (solo las que faltan) y luego su fila; reintentar no duplica nada
async function gsEnviar(r, avisar = () => {}) {
  const id = envioId(r), fotos = fotosDe(r); r.gs = r.gs || {}; r.gs.fotos = r.gs.fotos || {};
  for (let i = 0; i < fotos.length; i++) { const f = fotos[i]; if (r.gs.fotos[f.id]) continue;
    avisar(`${r.code}: subiendo foto ${i + 1} de ${fotos.length} a Drive…`);
    const j = await gsCall({ action: "subirFoto", foto: { id: f.id, encuesta: id, codigo: r.code, estrato: r.estrato, evaluador: f.p.encuestador || r.encuestador, paso: f.paso, tarea: f.tarea, ts: f.p.at, data: f.p.data } });
    r.gs.fotos[f.id] = { archivo: j.archivo, url: j.url }; await DB.putRaw(r); }
  avisar(`${r.code}: guardando en la tabla «Encuestas»…`);
  const refs = fotos.map(f => r.gs.fotos[f.id]).filter(Boolean);
  const rec = JSON.parse(JSON.stringify(r, (k, v) => k === "data" ? undefined : v));
  await gsCall({ action: "guardarEncuesta", rec: Object.assign(rec, { id }), fila: filaSheets(r, refs) });
  r.gs.at = new Date().toISOString(); r.gs.ok = true; await DB.putRaw(r);
}
// el participante abierto en pantalla se usa tal cual (así el autoguardado no borra la marca de envío)
const gsRec = async code => S.rec?.code === code ? S.rec : (await DB.all()).find(x => x.code === code);
// envío automático y silencioso al cerrar cada momento o al registrar un rechazo (si hay conexión y servidor)
async function gsAuto(code) {
  if (!gsUrl() || !navigator.onLine) return;
  try { const r = await gsRec(code); if (r && gsPend(r)) { await gsEnviar(r); toast(`${code} enviado a Google Sheets`); } }
  catch { /* queda pendiente; se reintenta desde «Enviar datos» */ }
}

/* =================== Modo audio (como Ejemplo): escuchar cada pregunta y responder con la voz ===================
   Trabaja sobre las preguntas ya dibujadas: cada grupo de opciones (.opts), cada casilla suelta y cada campo con
   data-bind recibe los botones «Escuchar» y «Responder con la voz», así sirve para todos los instrumentos. */
const Voz = {
  SR: window.SpeechRecognition || window.webkitSpeechRecognition || null,
  tts: "speechSynthesis" in window,
  init() {
    const live = document.createElement("div"); live.id = "aud-live"; live.className = "sr-only"; live.setAttribute("aria-live", "polite"); document.body.appendChild(live);
    // vuelve a preparar las preguntas cada vez que cambia el paso o se redibuja una sección
    let t; new MutationObserver(() => { clearTimeout(t); t = setTimeout(() => this.enhance(), 60); }).observe($("#app"), { childList: true, subtree: true });
    if (this.tts) speechSynthesis.getVoices();
  },

  // ---------- qué es una pregunta y qué opciones tiene ----------

  // ---------- botones en cada pregunta ----------
  enhance() {

  sayBtn(tip, read) {
    const bar = document.createElement("div"); bar.className = "aud";
    bar.innerHTML = `<button type="button" class="a-say" title="${esc(tip)}" aria-label="${esc(tip)}">${ms("volume_up")}</button>`;

  },
  // texto de una parte de la presentación, sin la etiqueta «Parte X de 4» y con pausas entre bloques
  presText(sec) {
    const dot = x => /[.!?]$/.test(x) ? x : x + ".";
    const c = sec.cloneNode(true); $$(".aud, small, .ms, .n", c).forEach(x => x.remove());
    return $$("h3, p, .tl .s b, .tl .s span", c).map(el => el.textContent.replace(/\s+/g, " ").trim()).filter(Boolean)

  presAudio() {

  },
  // ---------- responder con la voz ----------
  listen(u, btn) {

  norm(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ.,\s]/g, " ").replace(/\s+/g, " ").trim(); },
  NUM: { cero: 0, uno: 1, una: 1, un: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20, veintiuno: 21, veintidos: 22, veintitres: 23, veinticuatro: 24, veinticinco: 25, veintiseis: 26, veintisiete: 27, veintiocho: 28, veintinueve: 29, treinta: 30, cuarenta: 40, cincuenta: 50, sesenta: 60, setenta: 70, ochenta: 80, noventa: 90, cien: 100, ciento: 100 },

  apply(u, alts) {

    // la sección puede volver a dibujarse al responder (Nórdico, PTAI); la barra se busca de nuevo por su campo
    setTimeout(() => {
      const bar = $$(".aud").find(b => b.dataset.for === this.key(u));

/* =================== Inicio =================== */
Voz.init();
// contador de respuestas al responder; las secciones que se redibujan se vuelven a contar
["change", "input"].forEach(ev => $("#app").addEventListener(ev, () => setTimeout(updAnswered, 30)));
// sin la fuente de iconos (sin conexión) se ocultan los iconos en lugar de mostrar su nombre en texto
(async () => {
  try { await Promise.race([document.fonts.load('24px "Material Symbols Outlined"', "home"), new Promise(r => setTimeout(r, 5000))]); } catch {}
  if (!document.fonts.check('24px "Material Symbols Outlined"', "home")) document.documentElement.classList.add("no-ms");
})();
function applyRoute() {
  const r = location.hash === "#admin" ? "admin" : location.hash === "#encuesta" ? "encuesta" : "inicio";
  if (r === "admin") S.view = ADM.unlocked ? "admin" : "adminLogin";
  else if (r === "encuesta") { if (S.view === "flow") return; if (!S.rec) { S.rec = blankRecord(); S.step = 0; S.slide = 0; } S.view = "flow"; }
  else S.view = "home";
  render(); scrollTo({ top: 0 });
}
window.addEventListener("hashchange", applyRoute);
const syncTopbar = () => document.documentElement.style.setProperty("--topbar-h", $("header.top").offsetHeight + "px");
if (window.ResizeObserver) new ResizeObserver(syncTopbar).observe($("header.top")); else addEventListener("resize", syncTopbar);
syncTopbar();
DB.open().then(restoreSession).then(applyRoute).catch(() => { $("#app").innerHTML = '<div class="card note">Este navegador no permite guardar datos (IndexedDB). Use Chrome o Safari actualizado.</div>'; });
</script>
